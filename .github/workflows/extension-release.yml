# Nowstr Bridge（ブラウザ拡張）の zip を作り、GitHub Release に添付する。
#
# 使い方: extension/manifest.json の version を上げてコミットし、同じ番号のタグを push する。
#   git tag extension-v0.1.3 && git push origin extension-v0.1.3
#
# 添付するファイル名は常に nowstr-bridge.zip にしているので、
# https://github.com/<owner>/<repo>/releases/latest/download/nowstr-bridge.zip で最新版を取得できる。
name: Release Nowstr Bridge

on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#extension-v}"
          manifest="$(jq -r .version extension/manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ($tag) and extension/manifest.json version ($manifest) differ"
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"

      - name: Pack extension
        run: cd extension && zip -qr ../nowstr-bridge.zip . -x types.d.ts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nowstr-bridge.zip \
            --title "Nowstr Bridge v$VERSION" \
            --notes "YouTube Music で再生中の曲を Nowstr に渡すブラウザ拡張です。

          インストール方法:
          1. 下の **nowstr-bridge.zip** をダウンロードして展開する
          2. \`chrome://extensions\` を開き、右上の「デベロッパー モード」をオンにする
          3. 「パッケージ化されていない拡張機能を読み込む」から、展開したフォルダを選ぶ

          更新するときは、展開したフォルダの中身を新しいものに置き換えてから、\`chrome://extensions\` で拡張の再読み込みボタンを押してください。"
