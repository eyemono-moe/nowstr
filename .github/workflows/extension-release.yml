# ブラウザ拡張 Nowstr の zip を作り、GitHub Release に添付する。
#
# 使い方: extension/manifest.json の version を上げてコミットし、同じ番号のタグを push する。
#   git tag extension-v0.3.0 && git push origin extension-v0.3.0
#
# 添付するファイル名は常に nowstr-extension.zip にしているので、
# https://github.com/<owner>/<repo>/releases/latest/download/nowstr-extension.zip で最新版を取得できる。
name: Release Nowstr extension

on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#extension-v}"
          manifest="$(jq -r .version extension/manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ($tag) and extension/manifest.json version ($manifest) differ"
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"

      # service worker とポップアップは TypeScript で書いているのでビルドする
      - uses: pnpm/action-setup@v4
        with:
          # package.json の devEngines.packageManager と揃える
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build service worker and popup
        run: pnpm exec vp build --config vite.extension.config.ts

      - name: Pack extension
        run: cd extension && zip -qr ../nowstr-extension.zip . -x 'src/*' content/types.d.ts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nowstr-extension.zip \
            --title "Nowstr v$VERSION" \
            --notes "YouTube Music・Spotify・SoundCloud で再生中の曲を、Nostr のステータスとして掲示するブラウザ拡張です。

          インストール方法:
          1. 下の **nowstr-extension.zip** をダウンロードして展開する
          2. \`chrome://extensions\` を開き、右上の「デベロッパー モード」をオンにする
          3. 「パッケージ化されていない拡張機能を読み込む」から、展開したフォルダを選ぶ

          更新するときは、展開したフォルダの中身を新しいものに置き換えてから、\`chrome://extensions\` で拡張の再読み込みボタンを押してください。"
